<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Preference Assistant — Observability Demo</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --border: #dde3ea; --text: #1c2733;
    --muted: #5b6b7c; --accent: #0972d3; --accent-dark: #0757a5;
    --user-bubble: #0972d3; --agent-bubble: #eef2f6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 20px;
           display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  .ctl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  select, button { font-size: 13px; padding: 6px 10px; border: 1px solid var(--border);
                   border-radius: 6px; background: #fff; color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: var(--accent-dark); }
  #session-label { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding: 20px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { margin: 10px 0; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }
  .bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px;
            line-height: 1.45; white-space: pre-wrap; }
  .user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
  .agent .bubble { background: var(--agent-bubble); border-bottom-left-radius: 4px; }
  .meta-toggle { font-size: 11px; color: var(--accent); cursor: pointer; margin-top: 4px;
                 background: none; border: none; padding: 0; }
  .telemetry { display: none; margin-top: 6px; max-width: 75%; background: #fbfcfd;
               border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
               font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--muted);
               overflow-x: auto; }
  .telemetry.open { display: block; }
  .telemetry dt { font-weight: 600; color: var(--text); margin-top: 6px; }
  .telemetry dd { margin: 1px 0 0 0; word-break: break-all; }
  .status { font-size: 12px; color: var(--muted); font-style: italic; }
  .error-text { color: #b3261e; }
  footer { background: var(--panel); border-top: 1px solid var(--border); padding: 14px 20px; }
  .input-row { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  #prompt { flex: 1; padding: 10px 12px; font-size: 14px; border: 1px solid var(--border);
            border-radius: 8px; resize: none; font-family: inherit; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
           background: #e7f1fb; color: var(--accent-dark); margin-left: 6px; }
</style>
</head>
<body>
<header>
  <h1>Travel Preference Assistant <span class="badge">AgentCore Observability Demo</span></h1>
  <div class="ctl">
    <label for="actor">Traveler</label>
    <select id="actor">
      <option value="demo-actor-ava">Traveler A (Ava)</option>
      <option value="demo-actor-ben">Traveler B (Ben)</option>
    </select>
  </div>
  <div class="ctl">
    <label for="scenario">Scenario</label>
    <select id="scenario">
      <option value="normal">Normal</option>
      <option value="slow">Slow tool</option>
      <option value="error">Tool error</option>
    </select>
  </div>
  <button class="primary" id="new-session">New Session</button>
  <span id="session-label"></span>
</header>
<main id="chat"></main>
<footer>
  <div class="input-row">
    <textarea id="prompt" rows="2" placeholder="Ask about a destination... (Enter to send, Shift+Enter for newline)"></textarea>
    <button class="primary" id="send">Send</button>
  </div>
</footer>
<script>
  let sessionId = newSessionId();
  const chat = document.getElementById('chat');
  const promptEl = document.getElementById('prompt');

  function newSessionId() {
    return 'sess-' + crypto.randomUUID().slice(0, 18);
  }
  function updateSessionLabel() {
    document.getElementById('session-label').textContent = 'session: ' + sessionId;
  }
  updateSessionLabel();

  document.getElementById('new-session').addEventListener('click', () => {
    sessionId = newSessionId();
    updateSessionLabel();
    addStatus('New session started: ' + sessionId);
  });
  document.getElementById('actor').addEventListener('change', () => {
    sessionId = newSessionId();
    updateSessionLabel();
    addStatus('Traveler switched — new session: ' + sessionId);
  });

  function addStatus(text) {
    const div = document.createElement('div');
    div.className = 'status';
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addMessage(role, text, telemetry) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    if (telemetry) {
      const btn = document.createElement('button');
      btn.className = 'meta-toggle';
      btn.textContent = '▸ Telemetry';
      const panel = document.createElement('dl');
      panel.className = 'telemetry';
      panel.innerHTML = renderTelemetry(telemetry);
      btn.addEventListener('click', () => {
        panel.classList.toggle('open');
        btn.textContent = panel.classList.contains('open') ? '▾ Telemetry' : '▸ Telemetry';
      });
      wrap.appendChild(btn);
      wrap.appendChild(panel);
    }
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function renderTelemetry(t) {
    let rows = '';
    const add = (k, v) => { if (v !== undefined && v !== null && v !== '') rows += `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`; };
    add('session_id', t.session_id);
    add('actor_id', t.actor_id);
    add('runtime_session_id', t.runtime_session_id);
    add('scenario', t.scenario);
    add('trace_id', t.trace_id);
    const mp = t.memory_provenance;
    if (mp) {
      add('STM events used', mp.stm_events_used);
      add('LTM records retrieved', mp.ltm_record_count);
      (mp.ltm_records_retrieved || []).forEach((r, i) => {
        add('LTM record ' + (i + 1), r.record_id + ' — "' + r.snippet + '"');
      });
    }
    return rows || '<dd>(no telemetry fields returned)</dd>';
  }

  async function send() {
    const text = promptEl.value.trim();
    if (!text) return;
    promptEl.value = '';
    const actor = document.getElementById('actor').value;
    const scenario = document.getElementById('scenario').value;
    addMessage('user', text);
    addStatus('Thinking… (scenario: ' + scenario + ')');
    const statusEl = chat.lastChild;
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prompt: text, actor_id: actor, session_id: sessionId, scenario}),
      });
      const data = await res.json();
      statusEl.remove();
      if (!res.ok) {
        addMessage('agent', 'Error: ' + (data.detail || res.status));
        return;
      }
      addMessage('agent', data.response || JSON.stringify(data), data);
    } catch (e) {
      statusEl.remove();
      addMessage('agent', 'Request failed: ' + e.message);
    }
  }

  document.getElementById('send').addEventListener('click', send);
  promptEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
</script>
</body>
</html>
